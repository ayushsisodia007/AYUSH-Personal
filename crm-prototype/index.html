<title>Kestrel CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

/* Layout: floating rounded window on a soft gradient. Sidebar | topbar + page. Dashboard = tinted metrics band, then main column + right rail. AI chat slides in from the right. */
:root {
  --bg1: #e6e4f7; --bg2: #f4f3fb; --bg3: #e2eaf6;
  --win: #fafafe; --surface: #ffffff; --surface-2: #f4f4fa; --ink: #17162a; --muted: #6a6985; --line: #e6e5f1;
  --accent: #6b5be6; --accent-soft: #ecebfd; --accent-ink: #ffffff; --mint: #4fcfa7; --mint-soft: #d7f5ea; --sky: #78bfe8;
  --band: #eeedf9; --inv-bg: #17171f; --inv-fg: #f5f5fb; --inv-muted: #a6a5bd;
  --g: #1b8f4e; --g-soft: #dff3e6; --y: #9a7200; --y-soft: #fbf0c8; --o: #c85a05; --o-soft: #fde5d0; --r: #c62828; --r-soft: #fbdcdc;
  --av0: #d9d4fb; --av1: #cdeee3; --av2: #fde0c8; --av3: #d3e6f9; --av4: #f6d3e4;
  --hl: #fff3b0; --shadow: 0 30px 80px -30px rgba(60, 50, 140, .35);
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #0c0c18; --bg2: #11111f; --bg3: #0d1322;
    --win: #15152a; --surface: #1c1c34; --surface-2: #23233f; --ink: #ecebf8; --muted: #9b99ba; --line: #2e2e4c;
    --accent: #8d7ff9; --accent-soft: #28254d; --accent-ink: #12102a; --mint: #4fcfa7; --mint-soft: #153a31; --sky: #78bfe8;
    --band: #1f1f3a; --inv-bg: #ecebf8; --inv-fg: #17162a; --inv-muted: #5b5a78;
    --g: #4cc47f; --g-soft: #123423; --y: #e3b93a; --y-soft: #3a3010; --o: #f09342; --o-soft: #3d2410; --r: #ef7373; --r-soft: #3c1818;
    --av0: #3a3470; --av1: #1c4a3e; --av2: #5a3a1c; --av3: #1f3f5f; --av4: #5a2a43;
    --hl: #4a4210; --shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #0c0c18; --bg2: #11111f; --bg3: #0d1322;
  --win: #15152a; --surface: #1c1c34; --surface-2: #23233f; --ink: #ecebf8; --muted: #9b99ba; --line: #2e2e4c;
  --accent: #8d7ff9; --accent-soft: #28254d; --accent-ink: #12102a; --mint: #4fcfa7; --mint-soft: #153a31; --sky: #78bfe8;
  --band: #1f1f3a; --inv-bg: #ecebf8; --inv-fg: #17162a; --inv-muted: #5b5a78;
  --g: #4cc47f; --g-soft: #123423; --y: #e3b93a; --y-soft: #3a3010; --o: #f09342; --o-soft: #3d2410; --r: #ef7373; --r-soft: #3c1818;
  --av0: #3a3470; --av1: #1c4a3e; --av2: #5a3a1c; --av3: #1f3f5f; --av4: #5a2a43;
  --hl: #4a4210; --shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: linear-gradient(135deg, var(--bg1), var(--bg2) 45%, var(--bg3)); background-attachment: fixed; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100vh; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 14px; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.sm { font-size: 12px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); background: var(--win); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); min-height: calc(100vh - 28px); max-width: 1560px; margin: 0 auto; }
.side { padding: 24px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 14px; height: calc(100vh - 28px); overflow-y: auto; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; padding: 0 10px; }
.mark { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--sky)); display: grid; place-items: center; color: #fff; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .lab { flex: 1; }
.badge { font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 0 7px; min-width: 22px; text-align: center; line-height: 20px; }
.badge.alert { background: var(--r); color: #fff; }
.sec { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 12px 6px; }
.members { display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.member { display: flex; align-items: center; gap: 10px; min-width: 0; }
.member b { display: block; font-weight: 600; font-size: 13px; }
.member span { font-size: 11px; color: var(--muted); }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.me > div { min-width: 0; white-space: nowrap; }
.me .tbtn { all: unset; margin-left: auto; cursor: pointer; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
td.num { white-space: nowrap; }
.me .tbtn:focus-visible { outline: 2px solid var(--accent); }
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); flex: none; position: relative; }
.av.s { width: 26px; height: 26px; font-size: 10px; }
.av .on { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--g); border: 2px solid var(--win); }

.content { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 20px 28px 0; flex-wrap: wrap; }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 10px; color: var(--muted); background: var(--surface-2); border-radius: 14px; padding: 0 14px; min-width: 0; }
.search input { all: unset; flex: 1; min-width: 0; padding: 11px 0; color: var(--ink); }
.search:focus-within { outline: 2px solid var(--accent); }
.tb { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.tb:hover { background: var(--surface-2); }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tb:focus-visible { outline: 2px solid var(--accent); }
.tb.ai { background: linear-gradient(90deg, var(--accent), var(--sky)); color: #fff; }
.tb.dark { background: var(--inv-bg); color: var(--inv-fg); }
.page { padding: 20px 28px 36px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.phead p { color: var(--muted); margin-top: 4px; max-width: 64ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; min-width: 0; }
.card > .ch { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.pri { background: linear-gradient(90deg, var(--accent), var(--sky)); color: #fff; border-color: transparent; }
.btn.dk { background: var(--inv-bg); color: var(--inv-fg); border-color: transparent; }
.btn.xs { padding: 4px 11px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pillbtn { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.pillbtn:hover { color: var(--ink); }
.pillbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 1px var(--accent) inset; }
.pillbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pillbtn .badge { background: var(--accent); color: #fff; }
.hp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
.hp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.hp.green { color: var(--g); background: var(--g-soft); } .hp.yellow { color: var(--y); background: var(--y-soft); }
.hp.orange { color: var(--o); background: var(--o-soft); } .hp.red { color: var(--r); background: var(--r-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.line { background: transparent; border: 1px solid var(--line); }
.chip.src { background: var(--accent-soft); color: var(--accent); }
.chip.s-Discovery { background: var(--surface-2); } .chip.s-Demo { background: var(--accent-soft); color: var(--accent); }
.chip.s-Proposal { background: var(--y-soft); color: var(--y); } .chip.s-Negotiation { background: var(--o-soft); color: var(--o); }
.chip.s-Won { background: var(--g-soft); color: var(--g); } .chip.s-Lost { background: var(--r-soft); color: var(--r); }
.delta { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
.delta.up { color: var(--g); background: var(--g-soft); border-color: var(--g); } .delta.down { color: var(--r); background: var(--r-soft); border-color: var(--r); }

/* Dashboard */
.band { background: var(--band); border-radius: 24px; padding: 22px 26px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto auto; gap: 28px; align-items: center; }
.band h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.bars { display: flex; align-items: flex-end; gap: 12px; height: 110px; padding-left: 22px; position: relative; }
.bars .ax { position: absolute; left: 0; top: 0; bottom: 18px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--muted); }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--ink); }
.bar i { width: 100%; max-width: 30px; border-radius: 6px; background: var(--ink); display: block; }
.bar i.h { background: repeating-linear-gradient(135deg, var(--muted) 0 1.5px, transparent 1.5px 5px); border: 1px solid var(--muted); }
.gauge { position: relative; width: 230px; max-width: 100%; margin: 0 auto; }
.gauge .gc { position: absolute; inset: auto 0 6px 0; text-align: center; }
.gauge .gc b { font-size: 30px; font-weight: 600; display: block; line-height: 1.1; }
.bignum { display: flex; flex-direction: column; gap: 22px; }
.bignum b { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.bignum .lab { color: var(--muted); font-size: 13px; margin-top: 12px; display: flex; gap: 12px; align-items: center; }
.arrowbtn { all: unset; cursor: pointer; color: var(--ink); }
.arrowbtn:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.kpi .kt { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; }
.kpi .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpi .kv b { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.rev { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; }
.legend { display: flex; flex-direction: column; gap: 10px; font-weight: 600; margin-bottom: 14px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; }
.insight { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 16px; padding: 14px; font-size: 13px; display: flex; gap: 10px; min-height: 108px; white-space: pre-line; }
.insight svg { color: var(--accent); margin-top: 2px; }
.dchart { position: relative; padding-left: 40px; padding-bottom: 24px; }
.dyax { position: absolute; left: 0; top: 0; bottom: 24px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--muted); }
.dcols { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; height: 210px; position: relative; background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; background-position: 0 0; }
.dcol { display: flex; flex-direction: column-reverse; gap: 3px; align-items: center; cursor: pointer; padding-bottom: 1px; }
.dcol i { width: 78%; max-width: 12px; aspect-ratio: 1; border-radius: 50%; background: var(--mint); display: block; }
.dcol i.p { background: var(--mint-soft); }
.dcol.on i { background: var(--accent); } .dcol.on i.p { background: var(--accent-soft); outline: 1px solid var(--accent); }
.dxax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 8px; }
.tip { position: absolute; top: -8px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.25); pointer-events: none; white-space: nowrap; display: none; }
.tip div { display: flex; gap: 14px; justify-content: space-between; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; }
td { padding: 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.rowbtn { cursor: pointer; } tr.rowbtn:hover td { background: var(--surface-2); }
tr.rowbtn[aria-selected="true"] td { background: var(--accent-soft); }
.twrap { overflow-x: auto; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { display: block; font-weight: 700; } .who span { font-size: 12px; color: var(--muted); }
.rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.task { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; align-items: start; }
.task:hover { background: var(--surface-2); }
.task.first { background: var(--surface-2); }
.task b { display: block; font-weight: 700; } .task span.sub { font-size: 12.5px; color: var(--muted); display: block; }
.ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; margin-top: 2px; }
.ring::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.task.first .ring::after { background: var(--surface-2); }
.ring.done { background: var(--g); color: #fff; } .ring.done::after { display: none; }
.hbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
.hbar i { display: block; } .hbar .g { background: var(--g); } .hbar .y { background: var(--y); } .hbar .o { background: var(--o); } .hbar .r { background: var(--r); }
.aicard { background: linear-gradient(160deg, #3b2f9e, #5a49d6 55%, #5aa8dc); color: #fff; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.aicard h2 { font-size: 24px; line-height: 1.15; letter-spacing: -0.02em; }
.aicard .ask { all: unset; cursor: pointer; background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.aicard .ask:hover { background: rgba(255,255,255,.26); } .aicard .ask:focus-visible { outline: 2px solid #fff; }
.gapcard { border-radius: 18px; padding: 14px; background: var(--o-soft); display: flex; flex-direction: column; gap: 8px; }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(5, minmax(196px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kcol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.kcol.over .kbody { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 14px; }
.kh { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.kh .cnt { border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.kbody { display: flex; flex-direction: column; gap: 12px; min-height: 80px; }
.kcard { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); border: 1px solid transparent; border-radius: 18px; padding: 16px; cursor: grab; }
.kcard:hover { border-color: var(--line); background: var(--surface); }
.kcard:focus-visible { outline: 2px solid var(--accent); }
.kcard.sel { background: var(--inv-bg); color: var(--inv-fg); }
.kcard.sel .muted, .kcard.sel .kd { color: var(--inv-muted); }
.kcard.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
.kt1 { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 600; }
.kd { font-size: 13px; color: var(--muted); line-height: 1.45; }
.kdet { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-top: 2px; }
.kdet div { display: flex; gap: 8px; align-items: flex-start; }
.kdet svg { margin-top: 2px; opacity: .8; }
.kfoot { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
.kfoot .cc { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); margin-left: auto; }
.kcard.sel .kfoot .cc { color: var(--inv-muted); }
.kfoot .chip { background: transparent; border: 1px solid var(--line); color: inherit; }
.kcard.sel .kfoot .chip { border-color: #4c4b66; }
.risk { color: var(--o); font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; }

/* Calls */
.calls { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.citem { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.citem:hover { border-color: var(--accent); } .citem[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.citem:focus-visible { outline: 2px solid var(--accent); }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.transcript { display: flex; flex-direction: column; gap: 2px; max-height: 560px; overflow-y: auto; }
.tline { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 8px; transition: background .15s; }
.tline .n { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.tline.hl { background: var(--hl); }
.props { display: flex; flex-direction: column; gap: 10px; }
.prop { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.prop.accepted { border-color: var(--g); background: var(--g-soft); } .prop.rejected { opacity: .55; }

}

/* ==========================================================================
   03-model: state, persistence and CRM business logic. No DOM access.
   Entities: Lead, Account, Contact, Opportunity (deal), Activity, Task (activity of a task type),
   Product, Forecast (derived), Workflow, Agent, Agent Action, Customer Health (derived), Integration, User, Audit Log.
   ========================================================================== */
const KEY = 'kestrel.v3';
const S = { db: null };
const dbx = () => S.db;
const find = (arr, id) => arr.find(x => x.id === id);
const G = {
  user: id => find(dbx().users, id), acc: id => find(dbx().accounts, id), con: id => find(dbx().contacts, id), lead: id => find(dbx().leads, id),
  deal: id => find(dbx().deals, id), act: id => find(dbx().acts, id), wf: id => find(dbx().workflows, id), agent: id => find(dbx().agents, id),
  call: id => find(dbx().calls, id), action: id => find(dbx().actions, id), prod: id => find(dbx().products, id), integ: id => find(dbx().integrations, id)
};
const me = () => G.user(dbx().me);
const myRole = () => find(dbx().roles, me().role);
const can = p => myRole().perms.indexOf(p) >= 0;
const seq = k => ++dbx().seq[k];
const stamp = () => (dbx().clock += 2);
const slugOf = n => normCo(n).replace(/\s+/g, '');

function loadDb() { try { const r = typeof localStorage !== 'undefined' && localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); if (o && o.v === VERSION && o.db) return o.db; } } catch (e) { } return null; }
let saveTimer = null;
function persist() { if (typeof localStorage === 'undefined') return; clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify({ v: VERSION, db: S.db })); } catch (e) { } }, 120); }
function initDb(fresh) { const db = fresh ? null : loadDb(); if (db) { S.db = db; return; } S.db = seedDb(); bootAgents(); }
function resetDb() { try { localStorage.removeItem(KEY); } catch (e) { } S.db = seedDb(); bootAgents(); }

/* ---------- audit ---------- */
const WHO = { me: () => ({ n: me().n, type: 'user' }), agent: id => ({ n: G.agent(id).n, type: 'agent' }), wf: w => ({ n: w.n, type: 'workflow' }), sys: () => ({ n: 'Kestrel', type: 'system' }) };
function audit(who, action, ent, detail, extra) { const e = Object.assign({ id: 'AU-' + seq('audit'), at: stamp(), actor: who.n, type: who.type, action, ent: ent || { t: 'system', id: '', l: '' }, detail: detail || '' }, extra || {}); dbx().audit.unshift(e); return e; }
const entOf = (t, o) => ({ t, id: o.id, l: o.n || o.name || o.company || o.subj || o.id });

/* ---------- pipeline ---------- */
const stageNames = () => dbx().pipeline.stages.map(s => s.n);
const allStages = () => stageNames().concat(['Won', 'Lost']);
const stageProb = n => n === 'Won' ? 100 : n === 'Lost' ? 0 : ((dbx().pipeline.stages.filter(s => s.n === n)[0]) || { prob: 10 }).prob;

/* generic field binding: data-bind="entity:id:field" */
BIND.deal = (id, f, v) => {
  const d = G.deal(id), a = dealAcc(d);
  if (f === 'stage') { if (v === 'Lost') { openModal('lose', { id }); return false; } if (v === 'Won') { openModal('win', { id }); return false; } moveDeal(id, v); toast(a.n + ' moved to ' + v); return; }
  if (f === 'due') { setDealDue(id, offOf(v)); return; }
  if (f === 'decide') { d.decide = offOf(v); return; }
  if (f === 'v') { const n = parseFloat(v); if (n > 0) { audit(WHO.me(), 'Changed amount', entOf('deal', Object.assign({}, d, { n: a.n })), fmtL(d.v) + ' to ' + fmtL(n)); d.v = n; } return; }
  if (f === 'prob') { d.prob = v === '' ? null : Math.max(0, Math.min(100, parseFloat(v))); audit(WHO.me(), 'Changed probability', entOf('deal', Object.assign({}, d, { n: a.n })), d.prob == null ? 'Back to stage default' : d.prob + '%'); return; }
  if (f === 'own') { const o = d.own; d.own = v; audit(WHO.me(), 'Reassigned opportunity', entOf('deal', Object.assign({}, d, { n: a.n })), G.user(o).n + ' to ' + G.user(v).n); return; }
  if (f.indexOf('custom.') === 0) { d.custom[f.slice(7)] = v; return; }
  const old = d[f]; d[f] = v; audit(WHO.me(), 'Edited opportunity', entOf('deal', Object.assign({}, d, { n: a.n })), f + ': ' + old + ' to ' + v);
};
BIND.lead = (id, f, v) => {
  const l = G.lead(id);
  if (f === 'own') { const o = l.own; l.own = v; audit(WHO.me(), 'Assigned lead', entOf('lead', Object.assign({}, l, { n: l.company })), G.user(o).n + ' to ' + G.user(v).n); toast('Lead assigned to ' + G.user(v).n); return; }
  if (f === 'status') { if (v === 'Disqualified') { openModal('dq', { id }); return false; } if (v === 'Qualified' && bantCount(l) < 3) { toast('Confirm at least 3 of the 4 BANT criteria first.'); return; } setLeadStatus(id, v); return; }
  if (f === 'emp') { l.emp = parseInt(v, 10) || 0; l.size = sizeLabel(l.emp); return; }
  if (f.indexOf('bant.') === 0) { l.bant[f.slice(5)] = !!v; return; }
  if (f.indexOf('custom.') === 0) { l.custom[f.slice(7)] = v; return; }
  l[f] = v; audit(WHO.me(), 'Edited lead', entOf('lead', Object.assign({}, l, { n: l.company })), f);
};
BIND.acc = (id, f, v) => { const a = G.acc(id); if (f === 'own') { const o = a.own; a.own = v; audit(WHO.me(), 'Reassigned account', entOf('account', a), G.user(o).n + ' to ' + G.user(v).n); return; } if (f.indexOf('custom.') === 0) { a.custom[f.slice(7)] = v; return; } a[f] = v; audit(WHO.me(), 'Edited account', entOf('account', a), f); };
BIND.con = (id, f, v) => { if (f === 'role') { setContactRole(id, v); return; } const c = G.con(id); c[f] = v; audit(WHO.me(), 'Edited contact', entOf('contact', c), f); };
BIND.act = (id, f, v) => { const a = G.act(id); if (f === 'when') a.when = offOf(v); else a[f] = v; };
BIND.set = (id, f, v, el) => BIND.settings(id, f, v, el);

const period = () => tabOf('period', 'quarter');
let DOT = [];
function gaugeSvg(pct) {
  let s = ''; const n = 40;
  for (let i = 0; i <= n; i++) { const th = Math.PI - (i / n) * Math.PI, c = Math.cos(th), sn = Math.sin(th); s += '<line x1="' + (115 + 100 * c).toFixed(1) + '" y1="' + (112 - 100 * sn).toFixed(1) + '" x2="' + (115 + 82 * c).toFixed(1) + '" y2="' + (112 - 82 * sn).toFixed(1) + '" stroke="' + (i / n <= pct ? 'var(--ink)' : 'var(--muted)') + '" stroke-width="1.6" opacity="' + (i / n <= pct ? 1 : .45) + '"/>'; }
  return '<svg viewBox="0 0 230 120" width="100%" aria-hidden="true">' + s + '</svg>';
}
function kpiBtn(label, value, sub, filt, view, extra) { return '<button class="kpi" type="button" data-act="kpi" data-v="' + (view || 'deals') + '" data-f=\'' + esc(JSON.stringify(filt || {})) + '\'><div class="kt">' + label + (extra || '') + '</div><div class="kv"><b class="num">' + value + '</b><span class="muted sm">' + sub + '</span></div></button>'; }
ACT.kpi = t => { go(t.dataset.v, JSON.parse(t.dataset.f)); return false; };

function dotChart() {
  const R = 10, per = 2; DOT = []; let cols = '';
  const won = dbx().deals.filter(d => d.stage === 'Won'), open = openDeals();
  for (let b = 0; b < 30; b++) {
    const lo = -30 + 2 * b, hi = lo + 1;
    const w = won.filter(d => d.due >= lo && d.due <= hi), pr = open.filter(d => (d.due >= lo && d.due <= hi) || (b === 15 && d.due < 0));
    const a = sum(w, d => d.v), p = sum(pr, wval);
    DOT.push({ lo, a, p, w: w.map(d => dealAcc(d).n), pr: pr.map(d => dealAcc(d).n) });
    const na = Math.min(R, Math.ceil(a / per)), np = Math.min(R - na, Math.ceil((a + p) / per) - na);
    let dots = ''; for (let r = 0; r < na; r++) dots += '<i></i>'; for (let r = 0; r < np; r++) dots += '<i class="p"></i>';
    cols += '<div class="dcol" data-i="' + b + '">' + dots + '</div>';
  }
  return '<div class="dchart"><div class="dyax"><span>₹20L</span><span>₹14L</span><span>₹8L</span><span>₹2L</span></div><div class="dcols" id="dcols">' + cols + '<div class="tip" id="tip"></div></div><div class="dxax"><span>' + fmtD(-30) + '</span><span>' + fmtD(-16) + '</span><span>Today</span><span>' + fmtD(14) + '</span><span>' + fmtD(29) + '</span></div></div>';
}
function monthlyChart() {
  const m = monthly(), mx = Math.max.apply(null, m.map(x => x.actual + x.commit + x.best), 1);
  return '<div class="mchart">' + m.map(x => { const h = v => Math.round(v / mx * 120); return '<div class="mcol" title="' + x.m + ': won ' + fmtL(x.actual) + (x.future ? ', commit ' + fmtL(x.commit) + ', best case (weighted) ' + fmtL(x.best) : '') + '"><div class="mstack"><i class="mb" style="height:' + h(x.best) + 'px"></i><i class="mc" style="height:' + h(x.commit) + 'px"></i><i class="ma" style="height:' + h(x.actual) + 'px"></i></div><span>' + x.m + '</span></div>'; }).join('') + '</div><div class="row sm muted" style="gap:14px;margin-top:6px"><span><i class="sw ma"></i>Won</span><span><i class="sw mc"></i>Commit</span><span><i class="sw mb"></i>Best case, weighted</span></div>';
}
function revTile(label, val, sub, filt, tip) { return '<button class="tile" type="button" ' + (filt ? 'data-act="kpi" data-v="deals" data-f=\'' + esc(JSON.stringify(filt)) + '\'' : 'data-act="toast" data-id="' + esc(tip || '') + '"') + '><span class="muted sm">' + label + '</span><b class="num">' + val + '</b><span class="muted sm">' + sub + '</span></button>'; }

function secRevenue() {
  const p = period(), r = revenue(p), name = periodName(p);
  const st = stageNames().map(s => ({ s, n: dbx().deals.filter(d => d.stage === s).length }));

  const ins = forecastInsight(p);
  const factors = ins.factors.length ? ins.factors.map(f => '<div class="factor"><div>' + ic('warn', 16) + '<b>' + esc(f.t) + '</b><div class="muted sm">Evidence: ' + esc(f.ev) + '</div></div>' + (f.ids ? '<button class="btn xs" type="button" data-act="kpi" data-v="deals" data-f=\'' + esc(JSON.stringify({ ids: f.ids })) + '\'>View deals</button>' : '<button class="btn xs" type="button" data-act="kpi" data-v="deals" data-f=\'{"open":true}\'>View pipeline</button>') + '</div>').join('') : '<p class="muted">No major forecast risks detected.</p>';

  return '<section id="sec-a" class="secwrap">' + sect(ic('deals', 18) + ' Revenue performance', '<div class="row">' + tabs('period', [['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year']], p) + '</div>') +
    '<div class="band"><div><h3>Pipeline by stage</h3><div class="bars">' + bars + '</div></div>' +
    '<button class="gauge as-btn" type="button" data-act="kpi" data-v="deals" data-f=\'{"result":"closed"}\' aria-label="Win rate ' + Math.round(r.winRate * 100) + ' percent. Open closed deals">' + gaugeSvg(r.winRate) + '<div class="gc"><b>' + Math.round(r.winRate * 100) + '%</b><span class="muted sm">Win rate, last 90 days</span></div></button>' +
    '<button class="bignum as-btn" type="button" data-act="kpi" data-v="deals" data-f=\'{"open":true}\'><b class="num">' + fmtL(r.pipe) + '</b><div class="lab"><span>Pipeline value</span>' + ic('arrow', 18) + '</div></button>' +
    '<button class="bignum as-btn" type="button" data-act="kpi" data-v="deals" data-f=\'{"fc":"forecast"}\'><b class="num">' + fmtL(r.forecast) + '</b><div class="lab"><span>Forecast revenue</span>' + ic('arrow', 18) + '</div></button></div>' +
    '<div class="kpis">' + kpiBtn('Revenue achieved', fmtL(r.wonV), 'of ' + fmtL(r.quota) + ' quota', { result: 'won' }, 'deals', '<span class="delta ' + (r.attain >= 0.5 ? 'up' : 'down') + '">' + Math.round(r.attain * 100) + '%</span>') +
    kpiBtn('Quota attainment', Math.round(r.attain * 100) + '%', 'forecast ' + Math.round(r.fAttain * 100) + '%', { fc: 'forecast' }, 'deals', '<span class="delta ' + (r.fAttain >= 1 ? 'up' : 'down') + '">' + (r.fAttain >= 1 ? 'on track' : 'short') + '</span>') +
    kpiBtn('Pipeline coverage', r.coverage == null ? 'Quota met' : r.coverage.toFixed(1) + 'x', 'guideline 3x', { open: true }, 'deals', '<span class="delta ' + (r.coverage == null || r.coverage >= 3 ? 'up' : 'down') + '">' + (r.coverage == null || r.coverage >= 3 ? 'healthy' : 'thin') + '</span>') + '</div>' +

function secCustomers() {
  const hc = { green: 0, yellow: 0, orange: 0, red: 0 }; customers().forEach(a => { hc[health(a)]++; });

ACT.txprocess = () => {
  const text = ($('#txText') || {}).value || UI.txText || '', dealId = ($('#txDeal') || {}).value || UI.txDeal || 'd-sunrise'; UI.txText = text; UI.txDeal = dealId;
  const tr = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^([A-Za-z][A-Za-z .]{0,24}):\s*(.+)$/); return m ? { who: m[1], t: m[2] } : { who: 'Speaker', t: l }; });
  if (tr.length < 2) { toast('Paste at least two lines of transcript.'); return false; }
  const d = G.deal(dealId), c = createCall({ acc: d.acc, deal: d.id, con: (primaryContact(d) || {}).id, who: tr[0].who, transcript: tr, subj: 'pasted transcript', time: '15:30', min: tr.length * 2, sum: 'Transcript pasted by ' + me().n + '.' });
  UI.selCall = c.id; UI.callBusy = true; rerender();
  const finish = (script, live) => { UI.callBusy = false; const out = processCall(c.id, script); toast((live ? 'Claude' : 'Keyword fallback') + ' proposed ' + out.length + ' update' + (out.length === 1 ? '' : 's') + ' from ' + tr.length + ' lines. Review and approve.'); render(); };
  if (!sampleFn) { setTimeout(() => finish(extractHeuristic(c), false), 600); return false; }
  const prompt = 'Extract CRM updates from this sales meeting transcript. Return ONLY a JSON array, no prose. Each item: {"type":"stage"|"amount"|"competitor"|"contact"|"next_step","value":string or number,"title":string (contacts only),"role":string (contacts only),"line":number (1-based transcript line),"conf":number 0-1}. Allowed stages: ' + stageNames().concat(['Won']).join(', ') + '. Amount is in INR lakh as a number. Allowed contact roles: ' + CONTACT_ROLES.join(', ') + '. Only include facts stated in the transcript.\n\nTranscript:\n' + tr.map((l, i) => (i + 1) + '. ' + l.who + ': ' + l.t).join('\n');
  sampleFn(prompt, { cache: false, modelTier: 'quick' }).then(r => {
    const m = r.text.match(/\[[\s\S]*\]/); const arr = JSON.parse(m ? m[0] : r.text), script = [];
    arr.forEach(x => { const line = Math.min(Math.max(parseInt(x.line, 10) || 1, 1), tr.length), conf = Math.min(1, Math.max(0.3, Number(x.conf) || 0.7));
      if (x.type === 'stage' && allStages().indexOf(x.value) >= 0 && x.value !== d.stage) script.push({ kind: 'deal_stage', field: 'Deal stage', from: d.stage, to: x.value, line, conf, p: { deal: d.id, to: x.value } });
      else if (x.type === 'amount' && Number(x.value) > 0) script.push({ kind: 'deal_field', field: 'Deal value', from: money(d.v), to: money(Number(x.value)), line, conf, p: { deal: d.id, field: 'v', to: Number(x.value) } });
      else if (x.type === 'competitor' && x.value && d.comps.indexOf(x.value) < 0) script.push({ kind: 'deal_competitor', field: 'Competitor', from: 'None', to: String(x.value), line, conf, p: { deal: d.id, to: String(x.value) } });
      else if (x.type === 'contact' && x.value) script.push({ kind: 'contact_add', field: 'New contact', from: 'None', to: x.value + (x.title ? ' (' + x.title + ')' : ''), line, conf, p: { acc: d.acc, deal: d.id, name: String(x.value), title: x.title || '', role: CONTACT_ROLES.indexOf(x.role) >= 0 ? x.role : 'Influencer' } });
      else if (x.type === 'next_step' && x.value) script.push({ kind: 'deal_field', field: 'Next step', from: d.next || 'None', to: String(x.value), line, conf, p: { deal: d.id, field: 'next', to: String(x.value) } }); });
    finish(script, true);
  }).catch(() => finish(extractHeuristic(c), false));
  return false;
};

/* ==========================================================================
   90-main: Kestrel AI chat assistant, chart hover, and start-up.

const chat = { open: false, msgs: [], busy: false };
const SUGG = ['Which deals are at risk this week?', 'What should I focus on today?', 'Where are competitors ahead of us?', 'Summarise Cobalt Logistics before my call', 'Which leads should I call first?', 'Draft a follow-up email to Priya at Harbor Bank'];
function fmtChat(t) {
  const s = esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return s.split('\n').map(l => /^\s*[-•*]\s+/.test(l) ? '&bull; ' + l.replace(/^\s*[-•*]\s+/, '') : l).join('<br>');
}
function paintChat() {
  const b = $('#cbody'); let h = '';
  if (!chat.msgs.length) h += '<div class="msg a">Hi ' + esc(me().n.split(' ')[0]) + '. I can see your deals, leads, accounts, agent proposals, workflows and forecast. Ask me anything, or pick one:</div><div class="sugs">' + SUGG.map(q => '<button class="sug" type="button" data-act="ask" data-q="' + esc(q) + '">' + ic('sparkle', 14) + esc(q) + '</button>').join('') + '</div>';
  chat.msgs.forEach(m => { h += '<div class="msg ' + (m.r === 'u' ? 'u' : 'a') + '">' + (m.text ? fmtChat(m.text) : '<span class="dots"><i></i><i></i><i></i></span>') + (m.tag ? '<span class="tag">' + esc(m.tag) + '</span>' : '') + '</div>'; });
  b.innerHTML = h; b.scrollTop = b.scrollHeight; $('#csend').disabled = chat.busy;
  $('#aiStatus').textContent = sampleFn ? 'Live AI, answers from your CRM data' : 'Demo mode, answers from your CRM data';
}
function snapshot() {

  return JSON.stringify({
    today: '1 Nov 2026 (Sunday)', currency: 'INR lakh (L)', user: me().n + ' (' + myRole().n + ')',
    openDeals: openDeals().map(d => ({ account: dealAcc(d).n, stage: d.stage, valueL: d.v, probability: dprob(d), forecast: d.fc, owner: G.user(d.own).n, closeBy: fmtD(d.due), slips: d.slip, risks: dealRisks(d), competitors: d.comps, nextBestAction: (nextBest(d) || {}).text, next: d.next })),
    closedThisQuarter: dbx().deals.filter(d => !isOpen(d) && d.due >= -31).map(d => ({ account: dealAcc(d).n, result: d.stage, valueL: d.v, lostReason: d.lostReason || undefined })),
    customers: customers().map(a => ({ name: a.n, industry: a.ind, arrL: a.arr, health: LABEL[health(a)], renewsInDays: a.renew, owner: G.user(a.own).n })),
    leads: dbx().leads.map(l => ({ name: l.name, company: l.company, status: l.status, score: l.score, priority: l.priority, source: l.source, owner: G.user(l.own).n })),
    forecastQ4: { wonL: q.wonV, quotaL: q.quota, forecastL: Math.round(q.forecast), pipelineL: q.pipe, weightedL: Math.round(q.weighted), coverageX: q.coverage ? +q.coverage.toFixed(1) : null, winRatePct: Math.round(q.winRate * 100) },
    waitingForApproval: pendingActions().map(a => ({ agent: a.agentName, title: a.title, confidencePct: Math.round(a.conf * 100), external: a.external })),
    workflows: dbx().workflows.map(w => ({ name: w.n, active: w.active, runs: w.runs })),
    marketRadar: { gaps: industryTable().filter(r => r.gap).map(r => r.n), signals: RADAR_SIGNALS.slice(0, 5).map(s => s.d + ' ' + s.co + ': ' + s.txt) },
    openTasks: dbx().acts.filter(a => isTaskLike(a) && !taskDone(a)).slice(0, 12).map(a => a.subj + ' (' + relD(a.when) + ')')
  });
}
function localAnswer(q) {
  const s = q.toLowerCase(), risky = openDeals().filter(d => dealRisks(d).length);
  const dealByName = openDeals().filter(d => s.indexOf(dealAcc(d).n.toLowerCase().split(' ')[0]) >= 0)[0], accByName = dbx().accounts.filter(a => s.indexOf(a.n.toLowerCase().split(' ')[0]) >= 0)[0];
  if (/draft|email|write|pitch/.test(s)) return /aviation|pitch/.test(s) ? 'Draft (not sent):\n\nSubject: Cutting ground-crew scheduling time\n\nHi [name], airlines like yours juggle shifts across many stations. We help ground operations build rosters in minutes and sync them with payroll. Could we do a 15-minute walkthrough next week?' : 'Draft (not sent):\n\nSubject: Quote and SOC 2 report\n\nHi Priya, thanks for the time today. I will send the formal quote by Friday with our SOC 2 report and data residency details for Arjun. Happy to join the board discussion on the 12th if useful.';
  if (/lead|call first|qualif/.test(s)) { const l = dbx().leads.filter(x => x.status !== 'Converted' && x.status !== 'Disqualified').sort((a, b) => (b.score == null ? -1 : b.score) - (a.score == null ? -1 : a.score)).slice(0, 4); return 'Best leads to work now:\n' + l.map(x => '- **' + x.name + '** at ' + x.company + ' (' + (x.score == null ? 'not scored' : 'score ' + x.score) + ', ' + x.status + ')').join('\n') + '\nRun Lead Intelligence to score the unscored ones.'; }
  if (/approv|agent|waiting/.test(s)) return pendingActions().length + ' proposals are waiting for you. Examples:\n' + pendingActions().slice(0, 4).map(a => '- ' + a.title + ' (' + a.agentName + ', ' + Math.round(a.conf * 100) + '% confidence)').join('\n');
  if (/workflow|automation/.test(s)) return 'Workflows: ' + dbx().workflows.map(w => '**' + w.n + '** (' + (w.active ? 'active' : 'paused') + ', ' + w.runs + ' runs)').join(', ') + '. Open Workflow Studio to simulate any of them.';
  if (/plan to win|win /.test(s) && dealByName) { const n = nextBest(dealByName); return '**' + dealAcc(dealByName).n + '** (' + fmtL(dealByName.v) + ', ' + dealByName.stage + '):\n- Next: ' + n.text + '\n- Why: ' + n.why + (dealRisks(dealByName).length ? '\n- Risks: ' + dealRisks(dealByName).join('; ') : ''); }
  if (/summar|brief|before my call|account/.test(s) && accByName) return '**' + accByName.n + '**: ' + accByName.type + (accByName.type === 'Customer' ? ', ' + LABEL[health(accByName)] + ' health, ₹' + accByName.arr + 'L ARR, renews in ' + accByName.renew + ' days' : '') + '.\n' + accountInsights(accByName).slice(0, 3).map(i => '- ' + i.t).join('\n');
  if (/risk|slip|danger|worr/.test(s)) return 'Deals at risk:\n' + risky.slice(0, 5).map(d => '- **' + dealAcc(d).n + '** (' + fmtL(d.v) + ', ' + d.stage + '): ' + dealRisks(d)[0]).join('\n') + '\nBiggest exposure: Cobalt Logistics, ₹26L renewal in 47 days with Orange health.';
  if (/aviation|market|radar|gap|competitor|vantage|plumeria|orbit/.test(s)) return '**Aviation is your gap.** Competitors have signals there (Vantage HR: Skyway Airlines case study and Aerolink logo; Orbit People is hiring an aviation sales manager) and you have 0 customers.\n- Angle: ground-crew shift scheduling\n- 5 targets: ' + RADAR_TARGETS.map(t => t.n).join(', ') + '\n- Also watch BlueWave Shipping: Plumeria cut annual-plan prices by 12%.';
  if (/forecast|pipeline|quarter|revenue|quota|coverage/.test(s)) { const r = revenue('quarter'); return 'Q4: won **' + fmtL(r.wonV) + '** of ' + fmtL(r.quota) + ' quota, forecast **' + fmtL(r.forecast) + '** (' + Math.round(r.fAttain * 100) + '%). Open pipeline ' + fmtL(r.pipe) + ', coverage ' + (r.coverage ? r.coverage.toFixed(1) + 'x' : 'met') + ', win rate ' + Math.round(r.winRate * 100) + '%.'; }
  if (/focus|today|priority|next|do first/.test(s)) return 'Top of your list:\n' + dbx().acts.filter(a => isTaskLike(a) && !taskDone(a)).sort((a, b) => a.when - b.when).slice(0, 4).map((a, i) => (i + 1) + '. **' + a.subj + '** (' + relD(a.when) + ')').join('\n');
  return 'I can answer from your CRM data: deal risks, today’s priorities, leads, customer health, competitor moves, forecast, pending agent approvals and workflows. I can also draft emails. Try "Which deals are at risk?".';
}
function ask(q) {

  const prompt = 'You are Kestrel, the AI sales copilot inside a CRM prototype. Answer ONLY from the CRM data below. If the data does not contain the answer, say so plainly. Be concise (under 130 words), plain text, short bullet lines starting with "- " are fine, use **bold** for names. Money is in INR lakh (L). Never invent customers, numbers or facts. You cannot take actions or send messages: when asked to write an email, write the draft and say it is a draft that has not been sent.\n\nCRM DATA:\n' + snapshot() + '\n\nCONVERSATION SO FAR:\n' + hist + '\n\nUSER QUESTION: ' + q;
  const fallback = note => { m.text = localAnswer(q); m.tag = note; chat.busy = false; paintChat(); };
  if (!sampleFn) return void setTimeout(() => fallback('Demo mode answer (live AI not connected)'), 500);
  sampleFn(prompt, { cache: false, modelTier: 'quick', onText: x => { m.text = x.text; paintChat(); } }).then(r => { m.text = r.text || m.text; m.tag = 'AI answer from your CRM data'; chat.busy = false; paintChat(); }).catch(() => fallback('Live AI unavailable, showing a demo answer'));
}
