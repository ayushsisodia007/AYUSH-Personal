<title>Kestrel CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating rounded window on a soft gradient. Sidebar | topbar + page. Dashboard = tinted metrics band, then main column + right rail. AI chat slides in from the right. */
:root {
  --bg1: #e6e4f7; --bg2: #f4f3fb; --bg3: #e2eaf6;
  --win: #fafafe; --surface: #ffffff; --surface-2: #f4f4fa; --ink: #17162a; --muted: #6a6985; --line: #e6e5f1;
  --accent: #6b5be6; --accent-soft: #ecebfd; --accent-ink: #ffffff; --mint: #4fcfa7; --mint-soft: #d7f5ea; --sky: #78bfe8;
  --band: #eeedf9; --inv-bg: #17171f; --inv-fg: #f5f5fb; --inv-muted: #a6a5bd;
  --g: #1b8f4e; --g-soft: #dff3e6; --y: #9a7200; --y-soft: #fbf0c8; --o: #c85a05; --o-soft: #fde5d0; --r: #c62828; --r-soft: #fbdcdc;
  --av0: #d9d4fb; --av1: #cdeee3; --av2: #fde0c8; --av3: #d3e6f9; --av4: #f6d3e4;
  --hl: #fff3b0; --shadow: 0 30px 80px -30px rgba(60, 50, 140, .35);
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #0c0c18; --bg2: #11111f; --bg3: #0d1322;
    --win: #15152a; --surface: #1c1c34; --surface-2: #23233f; --ink: #ecebf8; --muted: #9b99ba; --line: #2e2e4c;
    --accent: #8d7ff9; --accent-soft: #28254d; --accent-ink: #12102a; --mint: #4fcfa7; --mint-soft: #153a31; --sky: #78bfe8;
    --band: #1f1f3a; --inv-bg: #ecebf8; --inv-fg: #17162a; --inv-muted: #5b5a78;
    --g: #4cc47f; --g-soft: #123423; --y: #e3b93a; --y-soft: #3a3010; --o: #f09342; --o-soft: #3d2410; --r: #ef7373; --r-soft: #3c1818;
    --av0: #3a3470; --av1: #1c4a3e; --av2: #5a3a1c; --av3: #1f3f5f; --av4: #5a2a43;
    --hl: #4a4210; --shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg1: #0c0c18; --bg2: #11111f; --bg3: #0d1322;
  --win: #15152a; --surface: #1c1c34; --surface-2: #23233f; --ink: #ecebf8; --muted: #9b99ba; --line: #2e2e4c;
  --accent: #8d7ff9; --accent-soft: #28254d; --accent-ink: #12102a; --mint: #4fcfa7; --mint-soft: #153a31; --sky: #78bfe8;
  --band: #1f1f3a; --inv-bg: #ecebf8; --inv-fg: #17162a; --inv-muted: #5b5a78;
  --g: #4cc47f; --g-soft: #123423; --y: #e3b93a; --y-soft: #3a3010; --o: #f09342; --o-soft: #3d2410; --r: #ef7373; --r-soft: #3c1818;
  --av0: #3a3470; --av1: #1c4a3e; --av2: #5a3a1c; --av3: #1f3f5f; --av4: #5a2a43;
  --hl: #4a4210; --shadow: 0 30px 80px -30px rgba(0, 0, 0, .7); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: linear-gradient(135deg, var(--bg1), var(--bg2) 45%, var(--bg3)); background-attachment: fixed; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100vh; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 14px; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.sm { font-size: 12px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); background: var(--win); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); min-height: calc(100vh - 28px); max-width: 1560px; margin: 0 auto; }
.side { padding: 24px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 14px; height: calc(100vh - 28px); overflow-y: auto; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; padding: 0 10px; }
.mark { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), var(--sky)); display: grid; place-items: center; color: #fff; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .lab { flex: 1; }
.badge { font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 0 7px; min-width: 22px; text-align: center; line-height: 20px; }
.badge.alert { background: var(--r); color: #fff; }
.sec { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 12px 6px; }
.members { display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
.member { display: flex; align-items: center; gap: 10px; min-width: 0; }
.member b { display: block; font-weight: 600; font-size: 13px; }
.member span { font-size: 11px; color: var(--muted); }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.me > div { min-width: 0; white-space: nowrap; }
.me .tbtn { all: unset; margin-left: auto; cursor: pointer; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
td.num { white-space: nowrap; }
.me .tbtn:focus-visible { outline: 2px solid var(--accent); }
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink); flex: none; position: relative; }
.av.s { width: 26px; height: 26px; font-size: 10px; }
.av .on { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--g); border: 2px solid var(--win); }

.content { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 12px; padding: 20px 28px 0; flex-wrap: wrap; }
.search { flex: 1 1 240px; display: flex; align-items: center; gap: 10px; color: var(--muted); background: var(--surface-2); border-radius: 14px; padding: 0 14px; min-width: 0; }
.search input { all: unset; flex: 1; min-width: 0; padding: 11px 0; color: var(--ink); }
.search:focus-within { outline: 2px solid var(--accent); }
.tb { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.tb:hover { background: var(--surface-2); }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tb:focus-visible { outline: 2px solid var(--accent); }
.tb.ai { background: linear-gradient(90deg, var(--accent), var(--sky)); color: #fff; }
.tb.dark { background: var(--inv-bg); color: var(--inv-fg); }
.page { padding: 20px 28px 36px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.phead p { color: var(--muted); margin-top: 4px; max-width: 64ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; min-width: 0; }
.card > .ch { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.pri { background: linear-gradient(90deg, var(--accent), var(--sky)); color: #fff; border-color: transparent; }
.btn.dk { background: var(--inv-bg); color: var(--inv-fg); border-color: transparent; }
.btn.xs { padding: 4px 11px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: default; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pillbtn { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
.pillbtn:hover { color: var(--ink); }
.pillbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 1px var(--accent) inset; }
.pillbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pillbtn .badge { background: var(--accent); color: #fff; }
.hp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 12px; white-space: nowrap; }
.hp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.hp.green { color: var(--g); background: var(--g-soft); } .hp.yellow { color: var(--y); background: var(--y-soft); }
.hp.orange { color: var(--o); background: var(--o-soft); } .hp.red { color: var(--r); background: var(--r-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.line { background: transparent; border: 1px solid var(--line); }
.chip.src { background: var(--accent-soft); color: var(--accent); }
.chip.s-Discovery { background: var(--surface-2); } .chip.s-Demo { background: var(--accent-soft); color: var(--accent); }
.chip.s-Proposal { background: var(--y-soft); color: var(--y); } .chip.s-Negotiation { background: var(--o-soft); color: var(--o); }
.chip.s-Won { background: var(--g-soft); color: var(--g); } .chip.s-Lost { background: var(--r-soft); color: var(--r); }
.delta { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
.delta.up { color: var(--g); background: var(--g-soft); border-color: var(--g); } .delta.down { color: var(--r); background: var(--r-soft); border-color: var(--r); }

/* Dashboard */
.band { background: var(--band); border-radius: 24px; padding: 22px 26px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto auto; gap: 28px; align-items: center; }
.band h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.bars { display: flex; align-items: flex-end; gap: 12px; height: 110px; padding-left: 22px; position: relative; }
.bars .ax { position: absolute; left: 0; top: 0; bottom: 18px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; color: var(--muted); }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 11px; color: var(--ink); }
.bar i { width: 100%; max-width: 30px; border-radius: 6px; background: var(--ink); display: block; }
.bar i.h { background: repeating-linear-gradient(135deg, var(--muted) 0 1.5px, transparent 1.5px 5px); border: 1px solid var(--muted); }
.gauge { position: relative; width: 230px; max-width: 100%; margin: 0 auto; }
.gauge .gc { position: absolute; inset: auto 0 6px 0; text-align: center; }
.gauge .gc b { font-size: 30px; font-weight: 600; display: block; line-height: 1.1; }
.bignum { display: flex; flex-direction: column; gap: 22px; }
.bignum b { font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.bignum .lab { color: var(--muted); font-size: 13px; margin-top: 12px; display: flex; gap: 12px; align-items: center; }
.arrowbtn { all: unset; cursor: pointer; color: var(--ink); }
.arrowbtn:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.kpi .kt { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600; }
.kpi .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpi .kv b { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
.dash { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.rev { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; }
.legend { display: flex; flex-direction: column; gap: 10px; font-weight: 600; margin-bottom: 14px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 10px; }
.insight { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 16px; padding: 14px; font-size: 13px; display: flex; gap: 10px; min-height: 108px; white-space: pre-line; }
.insight svg { color: var(--accent); margin-top: 2px; }
.dchart { position: relative; padding-left: 40px; padding-bottom: 24px; }
.dyax { position: absolute; left: 0; top: 0; bottom: 24px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: var(--muted); }
.dcols { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; height: 210px; position: relative; background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; background-position: 0 0; }
.dcol { display: flex; flex-direction: column-reverse; gap: 3px; align-items: center; cursor: pointer; padding-bottom: 1px; }
.dcol i { width: 78%; max-width: 12px; aspect-ratio: 1; border-radius: 50%; background: var(--mint); display: block; }
.dcol i.p { background: var(--mint-soft); }
.dcol.on i { background: var(--accent); } .dcol.on i.p { background: var(--accent-soft); outline: 1px solid var(--accent); }
.dxax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 8px; }
.tip { position: absolute; top: -8px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 12px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.25); pointer-events: none; white-space: nowrap; display: none; }
.tip div { display: flex; gap: 14px; justify-content: space-between; }
table { border-collapse: collapse; width: 100%; min-width: 720px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; }
td { padding: 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tr.rowbtn { cursor: pointer; } tr.rowbtn:hover td { background: var(--surface-2); }
tr.rowbtn[aria-selected="true"] td { background: var(--accent-soft); }
.twrap { overflow-x: auto; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { display: block; font-weight: 700; } .who span { font-size: 12px; color: var(--muted); }
.rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.task { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; align-items: start; }
.task:hover { background: var(--surface-2); }
.task.first { background: var(--surface-2); }
.task b { display: block; font-weight: 700; } .task span.sub { font-size: 12.5px; color: var(--muted); display: block; }
.ring { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; margin-top: 2px; }
.ring::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); }
.task.first .ring::after { background: var(--surface-2); }
.ring.done { background: var(--g); color: #fff; } .ring.done::after { display: none; }
.hbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
.hbar i { display: block; } .hbar .g { background: var(--g); } .hbar .y { background: var(--y); } .hbar .o { background: var(--o); } .hbar .r { background: var(--r); }
.aicard { background: linear-gradient(160deg, #3b2f9e, #5a49d6 55%, #5aa8dc); color: #fff; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.aicard h2 { font-size: 24px; line-height: 1.15; letter-spacing: -0.02em; }
.aicard .ask { all: unset; cursor: pointer; background: rgba(255,255,255,.16); border-radius: 14px; padding: 10px 12px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.aicard .ask:hover { background: rgba(255,255,255,.26); } .aicard .ask:focus-visible { outline: 2px solid #fff; }
.gapcard { border-radius: 18px; padding: 14px; background: var(--o-soft); display: flex; flex-direction: column; gap: 8px; }

/* Kanban */
.board { display: grid; grid-template-columns: repeat(5, minmax(196px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kcol { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.kcol.over .kbody { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 14px; }
.kh { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.kh .cnt { border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.kbody { display: flex; flex-direction: column; gap: 12px; min-height: 80px; }
.kcard { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); border: 1px solid transparent; border-radius: 18px; padding: 16px; cursor: grab; }
.kcard:hover { border-color: var(--line); background: var(--surface); }
.kcard:focus-visible { outline: 2px solid var(--accent); }
.kcard.sel { background: var(--inv-bg); color: var(--inv-fg); }
.kcard.sel .muted, .kcard.sel .kd { color: var(--inv-muted); }
.kcard.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
.kt1 { display: flex; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 600; }
.kd { font-size: 13px; color: var(--muted); line-height: 1.45; }
.kdet { display: flex; flex-direction: column; gap: 6px; font-size: 12px; margin-top: 2px; }
.kdet div { display: flex; gap: 8px; align-items: flex-start; }
.kdet svg { margin-top: 2px; opacity: .8; }
.kfoot { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
.kfoot .cc { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); margin-left: auto; }
.kcard.sel .kfoot .cc { color: var(--inv-muted); }
.kfoot .chip { background: transparent; border: 1px solid var(--line); color: inherit; }
.kcard.sel .kfoot .chip { border-color: #4c4b66; }
.risk { color: var(--o); font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; }

/* Calls */
.calls { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: start; }
.clist { display: flex; flex-direction: column; gap: 8px; }
.citem { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.citem:hover { border-color: var(--accent); } .citem[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.citem:focus-visible { outline: 2px solid var(--accent); }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.transcript { display: flex; flex-direction: column; gap: 2px; max-height: 560px; overflow-y: auto; }
.tline { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 8px; transition: background .15s; }
.tline .n { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.tline.hl { background: var(--hl); }
.props { display: flex; flex-direction: column; gap: 10px; }
.prop { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.prop.accepted { border-color: var(--g); background: var(--g-soft); } .prop.rejected { opacity: .55; }

    q = (q || '').trim(); if (!q || chat.busy) return;
    chat.open = true; $('#chat').classList.add('open');
    chat.msgs.push({ r: 'u', text: q }); var m = { r: 'a', text: '' }; chat.msgs.push(m); chat.busy = true; paintChat();
    var hist = chat.msgs.slice(-9, -2).map(function (x) { return (x.r === 'u' ? 'User: ' : 'Assistant: ') + x.text; }).join('\n');
    var prompt = 'You are Kestrel, the AI sales copilot inside a CRM prototype. Answer ONLY from the CRM data below. If the data does not contain the answer, say so plainly. Be concise (under 130 words), plain text, short bullet lines starting with "- " are fine, use **bold** for names. Money is in INR lakh (L). Never invent customers, numbers or facts. When drafting an email, write it out ready to send.\n\nCRM DATA:\n' + snapshot() + '\n\nCONVERSATION SO FAR:\n' + hist + '\n\nUSER QUESTION: ' + q;
    function fallback(note) { m.text = localAnswer(q); m.tag = note; chat.busy = false; paintChat(); }
    if (!sampleFn) return setTimeout(function () { fallback('Demo mode answer (live AI not connected)'); }, 500);
    sampleFn(prompt, { cache: false, modelTier: 'quick', onText: function (x) { m.text = x.text; paintChat(); } }).then(function (r) { m.text = r.text || m.text; m.tag = 'AI answer from your CRM data'; chat.busy = false; paintChat(); }).catch(function () { fallback('Live AI unavailable, showing a demo answer'); });
  }
  function analyze() {
    state.insightBusy = true; rerender();
    var data = actual.map(function (a, i) { return dayLabel(i) + ': actual ₹' + (a * 0.5) + 'L, projected ₹' + (proj[i] * 0.5) + 'L'; }).join('; ');
    var p = 'You are a sales analyst. In under 60 words, give 2 or 3 plain-text insights from this daily won-revenue data (INR lakh) and one suggested action. Do not invent causes you cannot see in the data.\n' + data;
    function done(t) { state.insight = t; state.insightBusy = false; if (state.view === 'dashboard') rerender(); }
    if (!sampleFn) return setTimeout(function () { done('Revenue lands in bursts: the 7 strongest days make up over half of the 30-day total, and projected revenue sits above actual on most days. Suggested action: follow up on the proposals sent this month to turn the projected days into wins.'); }, 700);
    sampleFn(p, { cache: false, modelTier: 'quick' }).then(function (r) { done(r.text); }).catch(function () { done('Live analysis is unavailable right now. Showing the last saved insight.'); });
  }

  /* ---------- events ---------- */
  function addTicket(p) {
    var c = cust(state.simCust), before = healthOf(c); state.tkId++;
    c.tk.push({ id: 'SUP-' + state.tkId, p: p, d: 0, s: { P1: 'Service down for all users', P2: 'Feature broken for a team', P3: 'Minor issue reported' }[p] });
    var after = healthOf(c); state.selCust = c.id;
    if (RANK[after] > RANK[before]) {
      var k = counts(c), acts = { yellow: 'Ask the CSM to review these tickets before the next check-in.', orange: 'Book an exec call this week and flag the renewal (' + c.renew + ' days, ₹' + c.arr + 'L).', red: 'Escalate to leadership today. ₹' + c.arr + 'L ARR is at stake.' };
      state.alerts.unshift({ cust: c.n, from: before, to: after, when: 'Just now', why: k.P1 + ' P1, ' + k.P2 + ' P2, ' + k.P3 + ' P3 in 7 days (latest SUP-' + state.tkId + ')', act: acts[after] });
      toast(c.n + ' moved from ' + LABEL[before] + ' to ' + LABEL[after] + '. Account owner notified.');
    } else toast('Ticket logged. ' + c.n + ' stays ' + LABEL[after] + '.');
  }
  function openModal() {
    $('#modalHost').innerHTML = '<div class="ov" data-act="closemodal"><form class="modal" id="mform" role="dialog" aria-label="Add deal"><h2>Add deal</h2><label>Account<input id="m-n" required placeholder="e.g. Skyway Airlines"></label><label>Value (₹ lakh)<input id="m-v" type="number" min="1" value="10" required></label><label>Stage<select id="m-s">' + STAGES.slice(0, 4).map(function (s) { return '<option>' + s + '</option>'; }).join('') + '</select></label><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="closemodal">Cancel</button><button class="btn pri" type="submit">Add deal</button></div></form></div>';
    setTimeout(function () { var i = $('#m-n'); if (i) i.focus(); }, 0);
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'mform') {
      e.preventDefault();
      var n = $('#m-n').value.trim(); if (!n) return;
      var id = 'new' + Date.now();
      state.deals.unshift({ id: id, n: n, desc: 'Added manually', stage: $('#m-s').value, v: Number($('#m-v').value) || 1, own: 'AS', due: 30, cm: 0, fl: 0, contact: 'Not set', email: 'Not set', city: 'Not set', next: 'Add a first contact', comp: '' });
      state.selDeal = id; state.flash = id; $('#modalHost').innerHTML = ''; go('deals'); toast('Deal added to the board');
    }
    if (e.target.id === 'cform') { e.preventDefault(); var i = $('#cin'); var v = i.value; i.value = ''; ask(v); }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act, id = t.dataset.id;
    if (a === 'closemodal') { if (e.target.classList.contains('ov') || t.tagName === 'BUTTON') $('#modalHost').innerHTML = ''; return; }
    switch (a) {
      case 'go': return go(id);
      case 'play': state.q = t.dataset.q || ''; $('#q').value = state.q; return go(id);
      case 'chat': chat.open = true; $('#chat').classList.add('open'); paintChat(); $('#cin').focus(); return;
      case 'ask': return ask(t.dataset.q);
      case 'analyze': return analyze();
      case 'tab': state.tab = id; break;
      case 'opendeal': state.selDeal = id; state.view = 'deals'; try { history.replaceState(null, '', '#deals'); } catch (x) {} render(); window.scrollTo(0, 0); return;
      case 'opencust': state.selCust = id; state.simCust = id; if (state.view !== 'customers') { return go('customers'); } break;
      case 'gotask': { var tk = tasks0.filter(function (x) { return x.id === id; })[0]; return go(tk.link); }
      case 'seldeal': state.selDeal = id; break;
      case 'selcall': state.call = id; break;
      case 'toggletask': { var k = tasks0.filter(function (x) { return x.id === id; })[0]; if (k.auto) { toast('This one completes itself when you finish the work.'); return; } state.done[id] = !state.done[id]; break; }
      case 'accept': prop(id).status = 'accepted'; state.flash = 'harbor'; toast('Applied to CRM'); break;
      case 'reject': prop(id).status = 'rejected'; break;
      case 'edit': prop(id).editing = true; break;
      case 'cancel': prop(id).editing = false; break;
      case 'save': { var p = prop(id), v = $('#edit-' + id).value.trim(); if (v) p.to = v; p.editing = false; p.status = 'accepted'; state.flash = 'harbor'; toast('Edited and applied'); break; }
      case 'undo': prop(id).status = 'pending'; break;
      case 'all': state.proposals.forEach(function (p) { if (p.status === 'pending') p.status = 'accepted'; }); state.flash = 'harbor'; toast('All updates applied. Harbor Bank moved to Proposal.'); break;
      case 'targets': state.targetList = true; toast('Target list created from 14 sources (sample)'); break;
      case 'addtargets': state.targetsAdded = true; targets.forEach(function (x, i) { state.deals.unshift({ id: 'av' + i, n: x.n, desc: 'Aviation target: ' + x.why, stage: 'Discovery', v: 8, own: 'AS', due: 30 + i, cm: 0, fl: 0, contact: 'Not set', email: 'Not set', city: 'Not set', next: 'Research and first outreach', comp: '' }); }); toast('5 aviation companies added to Discovery (sample)'); break;
      case 'toast': toast(id); return;
      case 'tk': addTicket(id); break;
      case 'reset': { var v2 = state.view; state = fresh(); state.view = v2; toast('Demo reset'); break; }
    }
    rerender();
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="opendeal"],[data-act="opencust"],[data-act="gotask"],[data-act="toggletask"],[data-act="seldeal"]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape') { $('#modalHost').innerHTML = ''; if (chat.open) { chat.open = false; $('#chat').classList.remove('open'); } }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'cad') { state.cadence = e.target.value; rerender(); }
    if (e.target.id === 'simc') { state.simCust = e.target.value; state.selCust = e.target.value; rerender(); }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { state.q = e.target.value; $('#main').innerHTML = MAP[state.view](); } });
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest('.prop[data-line]');
    if (el) { var ln = document.querySelector('.tline[data-line="' + el.dataset.line + '"]'); if (ln) { ln.classList.add('hl'); ln.scrollIntoView({ block: 'nearest' }); } }
    var col = e.target.closest('.dcol');
    if (col) {
      document.querySelectorAll('.dcol.on').forEach(function (n) { n.classList.remove('on'); }); col.classList.add('on');
      var i = Number(col.dataset.i), tip = $('#tip'); tip.innerHTML = '<b>' + dayLabel(i) + '</b><div><span class="muted">Won</span><span>₹' + (actual[i] * 0.5) + 'L</span></div><div><span class="muted">AI projected</span><span>₹' + (proj[i] * 0.5) + 'L</span></div>';
      tip.style.display = 'block'; var left = col.offsetLeft + col.offsetWidth + 8; if (left + 150 > col.parentNode.clientWidth) left = col.offsetLeft - 150; tip.style.left = left + 'px';
    }
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target.closest('.prop[data-line]')) document.querySelectorAll('.tline.hl').forEach(function (n) { n.classList.remove('hl'); });
    var dc = e.target.closest('#dcols'); if (dc && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('#dcols'))) { document.querySelectorAll('.dcol.on').forEach(function (n) { n.classList.remove('on'); }); var tip = $('#tip'); if (tip) tip.style.display = 'none'; }
  });
  /* drag and drop between stages */
  var dragId = null;
  document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('.kcard'); if (!c) return; dragId = c.dataset.id; try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
  document.addEventListener('dragover', function (e) { var col = e.target.closest && e.target.closest('.kcol'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(function (n) { if (n !== col) n.classList.remove('over'); }); col.classList.add('over'); });
  document.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.kcol'); if (!col || !dragId) return; e.preventDefault();
    var d = deal(dragId), s = col.dataset.stage;
    if (d && d.stage !== s) {
      d.stage = s; if (d.id === 'harbor') { var p = prop('p1'); p.status = s === p.to ? 'accepted' : 'pending'; if (s !== p.to) p.from = s; }
      state.flash = d.id; state.selDeal = d.id; toast(d.n + ' moved to ' + s);
    }
    dragId = null; rerender();
  });
  document.addEventListener('dragend', function () { dragId = null; document.querySelectorAll('.kcol.over').forEach(function (n) { n.classList.remove('over'); }); });

  /* ---------- static wiring ---------- */
  $('#sortBtn').addEventListener('click', function () { state.sort = state.sort === 'value' ? 'due' : 'value'; rerender(); });
  $('#meBtn').addEventListener('click', function () { state.mine = !state.mine; rerender(); });
  $('#aiBtn').addEventListener('click', function () { chat.open = !chat.open; $('#chat').classList.toggle('open', chat.open); paintChat(); if (chat.open) $('#cin').focus(); });
  $('#addBtn').addEventListener('click', openModal);
  $('#chatX').addEventListener('click', function () { chat.open = false; $('#chat').classList.remove('open'); });
  $('#chatX').innerHTML = ic('close', 18); $('#csend').innerHTML = ic('send', 18);
  $('#chat .mark').innerHTML = ic('sparkle', 16);
  document.addEventListener('click', function (e) { if (e.target.id === 'themeBtn') { var r = document.documentElement, dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme = dark ? 'light' : 'dark'; } });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (MAP[h]) { state.view = h; render(); } });
  var h0 = location.hash.slice(1); if (MAP[h0]) state.view = h0;
  render(); paintChat();
  try { if (window.claude && window.claude.use) window.claude.use('sample').then(function (s) { sampleFn = s || null; paintChat(); }).catch(function () {}); } catch (e) {}
})();
</script>
